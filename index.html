<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheila Da Silva — Portfolio</title>
  <meta name="description" content="Portfolio of Sheila Da Silva. Coming soon.">
  <link rel="canonical" href="https://sheiladasilva.com/">
  <meta property="og:title" content="Sheila Da Silva — Portfolio">
  <meta property="og:description" content="Portfolio coming soon.">
  <meta property="og:url" content="https://sheiladasilva.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#111014; --ink:#f4efe9; --muted:#a39d97; --accent:#e8a87c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--bg); color:var(--ink);
      font-family:"Inter", system-ui, sans-serif;
      display:grid; place-items:center; text-align:center;
      padding:2rem; overflow:hidden;
    }
    body::before {
      content:""; position:fixed; inset:-30%;
      background:
        radial-gradient(40% 35% at 30% 40%, rgba(232,168,124,.18), transparent 70%),
        radial-gradient(35% 30% at 70% 65%, rgba(140,120,200,.16), transparent 70%);
      animation:drift 18s ease-in-out infinite alternate;
      z-index:-1;
    }
    @keyframes drift { to { transform:translate(4%, -3%) rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { body::before { animation:none; } }
    .eyebrow { font-size:.8rem; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); margin-bottom:1.5rem; }
    h1 { font-family:"Fraunces", Georgia, serif; font-weight:300; font-size:clamp(2.6rem, 9vw, 6rem); line-height:1; letter-spacing:-.02em; }
    h1 span { font-weight:500; font-style:italic; }
    p { margin-top:1.75rem; color:var(--muted); font-size:1.05rem; }
    footer { position:fixed; bottom:1.5rem; left:0; right:0; font-size:.8rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Portfolio</div>
    <h1>Sheila <span>Da Silva</span></h1>
    <p>New site coming soon.</p>
  </main>
  <footer>&copy; 2026 Sheila Da Silva</footer>
</body>
</html>
